<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chain Reaction</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="titlebar" id="titlebar">
        <div class="titlebar-drag-region">
            <div class="window-title">
                <img src="logo.icns" alt="Chain Reaction" class="app-icon">
                <span>Chain Reaction</span>
            </div>
        </div>
        <div class="window-controls">
            <button class="window-control" id="minimize-btn" title="Minimize">
                <svg width="12" height="12" viewBox="0 0 12 12">
                    <rect x="0" y="5" width="12" height="2" fill="currentColor"/>
                </svg>
            </button>
            <button class="window-control" id="maximize-btn" title="Maximize">
                <svg width="12" height="12" viewBox="0 0 12 12">
                    <rect x="0" y="0" width="12" height="12" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/>
                </svg>
            </button>
            <button class="window-control close" id="close-btn" title="Close">
                <svg width="12" height="12" viewBox="0 0 12 12">
                    <path d="M1 1l10 10M11 1L1 11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
            </button>
        </div>
    </div>

    <main class="container">
        <div class="ambient-glow glow-a"></div>
        <div class="ambient-glow glow-b"></div>

        <section class="menu-screen" id="main-menu">
            <p class="menu-kicker">ARENA MODE</p>
            <h1 class="menu-title">Chain Reaction</h1>
            <p class="menu-subtitle">Capture the board through cascading explosions.</p>

            <div class="menu-panel">
                <div class="menu-row">
                    <label for="player-count">Players</label>
                    <select id="player-count">
                        <option value="2" selected>2 Players</option>
                        <option value="3">3 Players</option>
                        <option value="4">4 Players</option>
                        <option value="5">5 Players</option>
                        <option value="6">6 Players</option>
                    </select>
                </div>

                <div class="menu-row">
                    <label for="starting-player">Starting Team</label>
                    <select id="starting-player"></select>
                </div>

                <button id="start-game-btn" class="start-btn">Start Match</button>
                <p class="menu-footnote">Critical mass depends on position: corners 2, edges 3, center 4.</p>
            </div>
        </section>

        <section class="game-screen hidden" id="game-screen" aria-hidden="true">
            <div class="hud-bar">
                <div class="turn-indicator" id="turn-indicator">
                    <span class="turn-label">Current Turn</span>
                    <span class="turn-player" id="turn-player-name">Crimson</span>
                </div>
                <div class="hud-actions">
                    <button id="new-game-btn" class="hud-btn">Restart</button>
                    <button id="menu-btn" class="hud-btn">Main Menu</button>
                </div>
            </div>

            <div id="game-wrapper">
                <canvas id="chain-canvas" width="720" height="480"></canvas>
            </div>

            <p class="status-line" id="status-line">Select options in the menu to begin.</p>
        </section>
    </main>

    <script src="renderer.js"></script>
    <script src="game.js"></script>
</body>
</html>
